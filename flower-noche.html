    <script>
      (function() {
        // 1. Modo Día y Noche (flower-noche.html es la versión nocturna por defecto)
        const toggleBtn = document.getElementById("flowerThemeToggle");
        const hour = new Date().getHours();
        const autoDay = hour >= 6 && hour < 18;

        let savedTheme = null;
        try { savedTheme = localStorage.getItem("flower_theme"); } catch(e){}

        // En flower-noche.html, si no hay preferencia previa, abre en noche
        let isDay = savedTheme !== null ? (savedTheme === "day") : false;

        function applyFlowerTheme(day) {
          if (day) {
            document.body.classList.remove("night-mode");
            document.body.classList.add("day-mode");
            if (toggleBtn) toggleBtn.textContent = "🌙";
          } else {
            document.body.classList.remove("day-mode");
            document.body.classList.add("night-mode");
            if (toggleBtn) toggleBtn.textContent = "☀️";
          }
          try { localStorage.setItem("flower_theme", day ? "day" : "night"); } catch(e){}
        }
        applyFlowerTheme(isDay);

        if (toggleBtn) {
          toggleBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            isDay = !isDay;
            applyFlowerTheme(isDay);
          });
        }

        // Reproducir audio automáticamente al primer toque si el navegador lo bloqueó
        const audio = document.querySelector("audio");
        if (audio) {
          audio.play().catch(() => {});
          window.addEventListener("pointerdown", () => {
            if (audio.paused) audio.play().catch(() => {});
          }, { once: true });
        }

        // 2. Corazones flotantes y Easter Egg: DOBLE CLIC (Double Tap) hacia WhatsApp
        let clickCount = 0;
        let clickResetTimer = null;
        const HEARTS = ["💛", "🌼", "✨", "💚", "💖"];

        function spawnFlowerHeart(x, y) {
          const span = document.createElement("span");
          span.className = "flower-floating-heart";
          span.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
          span.style.left = x + "px";
          span.style.top = y + "px";
          span.style.setProperty("--vx", (Math.random() - 0.5) * 60 + "px");
          span.style.setProperty("--vy", -(Math.random() * 45 + 25) + "px");
          span.style.setProperty("--rot", (Math.random() - 0.5) * 60 + "deg");
          document.body.appendChild(span);
          setTimeout(() => span.remove(), 1400);
        }

        window.addEventListener("pointerdown", (e) => {
          if (e.target.closest("#flowerThemeToggle")) return;
          spawnFlowerHeart(e.clientX, e.clientY);

          clickCount++;
          clearTimeout(clickResetTimer);
          clickResetTimer = setTimeout(() => { clickCount = 0; }, 480);

          // Doble clic / Double tap rápido
          if (clickCount >= 2) {
            clickCount = 0;
            if (navigator.vibrate) navigator.vibrate([40, 50]);

            for (let i = 0; i < 7; i++) {
              setTimeout(() => {
                spawnFlowerHeart(
                  e.clientX + (Math.random() - 0.5) * 90,
                  e.clientY + (Math.random() - 0.5) * 90
                );
              }, i * 50);
            }

            setTimeout(() => {
              const msg = encodeURIComponent("HOLA VALERIO ACEPTO 😊");
              window.location.href = `https://wa.me/51931537331?text=${msg}`;
            }, 300);
          }
        });
      })();
    </script>
